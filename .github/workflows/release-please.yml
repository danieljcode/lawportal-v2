name: Release Please

# Keeps one Release PR open with the next version and CHANGELOG.md, from the commit messages since the
# last release (LP-116, docs/releasing.md). Merging it tags vX.Y.Z, publishes the GitHub Release and
# bumps package.json. Settings: release-please-config.json; last version: .release-please-manifest.json.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Tidy what release-please writes (scripts/tidy-changelog.mjs: repeats dropped):
      # in the Release PR's CHANGELOG.md, folded into its one commit (release-please replaces it on its
      # next run anyway)…
      - name: Check out the Release PR
        if: steps.release.outputs.pr
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          # The commit's parent too: in a one-commit clone it has none, and the amend would drop its history.
          fetch-depth: 2
      - name: Tidy CHANGELOG.md
        if: steps.release.outputs.pr
        run: |
          node scripts/tidy-changelog.mjs CHANGELOG.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --amend --no-edit --all
            git push --force-with-lease
          fi
      # The Release PR's description holds the same notes, and release-please writes the GitHub Release
      # from it on merge.
      - name: Tidy the Release PR's description
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          # A step's env is worked out even when its `if` is false, and `pr` is empty with no Release PR (LP-161).
          PR: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: |
          gh pr view "$PR" --json body --jq .body > body.md
          node scripts/tidy-changelog.mjs body.md
          gh pr edit "$PR" --body-file body.md

      # …and in the GitHub Release's notes once it's published.
      - name: Check out the release
        if: steps.release.outputs.release_created
        uses: actions/checkout@v7
      - name: Tidy the release notes
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          node scripts/tidy-changelog.mjs notes.md
          gh release edit "$TAG" --notes-file notes.md
