name: CI

on:
  push:
  pull_request:

# Read-only: it tests and builds, and writes nothing back to the repository (LP-166).
permissions:
  contents: read

# Three jobs at once (LP-243): the checks, and the end-to-end tests split across two machines. The
# test-and-build job at the end is the required check on main, and passes only when all of them do.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v7

      # Later steps run package code, so they only learn whether the secret is there, never the secret (LP-196).
      - &reference
        name: Is the reference data available?
        id: reference
        env:
          # Read-only token for the private reference repo (docs/templates-and-forms.md, Reference data).
          REFERENCE_TOKEN: ${{ secrets.REFERENCE_TOKEN }}
        run: if [ -n "$REFERENCE_TOKEN" ]; then echo "available=1" >> "$GITHUB_OUTPUT"; fi

      # The parity tests need it; without the secret (forks) they skip with a note.
      - &reference-checkout
        name: Check out reference data
        if: steps.reference.outputs.available == '1'
        uses: actions/checkout@v7
        with:
          repository: danieljcode/lawportal-reference
          token: ${{ secrets.REFERENCE_TOKEN }}
          path: .agents/reference/jsa
          persist-credentials: false

      - &node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - &install
        run: npm ci

      # Fails on high or critical advisories in what ships (devDependencies are left
      # to Dependabot). See docs/dependencies.md.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      # ESLint with no warnings allowed, and Prettier formatting (LP-86).
      - run: npm run lint
      - run: npm run format:check

      - run: npm test
        env:
          # With the data checked out, a missing file fails the run instead of skipping.
          LAWAPP_REQUIRE_REFERENCE: ${{ steps.reference.outputs.available }}

  # Real-browser smoke tests of the key journeys, at desktop and phone widths (LP-6), the screenshot
  # comparisons (LP-117) and the accessibility check (LP-118), half on each machine.
  e2e:
    runs-on: ubuntu-latest
    # Playwright's Linux image, with Chromium and its fonts, so the screenshot tests (LP-117) render the
    # same every run. Keep the tag at the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - *checkout
      # The container runs as root over files the runner owns; checkout trusts them only for its own step.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - *reference
      - *reference-checkout
      - *node
      - *install
      - run: npm run build
      - name: End-to-end smoke, screenshot and accessibility tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      # A failed screenshot comparison leaves its expected, actual and diff images here.
      - name: Upload screenshots and traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # The required check on main: keeps its name from when CI was one job.
  test-and-build:
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.checks.result }}" = success && test "${{ needs.e2e.result }}" = success
